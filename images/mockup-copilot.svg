<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="760" height="560" fill="#f6f8fa"/>
  <rect x="20" y="20" width="720" height="520" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="44" y="56" font-size="16" font-weight="bold" fill="#1f2328">support#231 — 開発GCEからオンプレFSへ接続不可</text>
  <rect x="628" y="38" width="88" height="26" rx="13" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="672" y="55" font-size="12" fill="#7d4e00" text-anchor="middle">回答待ち</text>

  <!-- AI interpretation panel -->
  <rect x="44" y="80" width="328" height="128" rx="8" fill="#f6f8fa"/>
  <text x="60" y="104" font-size="12" fill="#57606a">AIの解釈</text>
  <text x="60" y="128" font-size="12.5" fill="#1f2328">案件A・開発環境。宛先はオンプレFS(203.0.x.x)。</text>
  <text x="60" y="148" font-size="12.5" fill="#1f2328">FW台帳に該当ルールなし。プロキシ対象外の宛先。</text>
  <text x="60" y="172" font-size="12.5" fill="#0969da">→ FW未申請が濃厚</text>

  <!-- similar cases panel -->
  <rect x="388" y="80" width="328" height="128" rx="8" fill="#f6f8fa"/>
  <text x="404" y="104" font-size="12" fill="#57606a">類似事例 3件</text>
  <text x="404" y="128" font-size="12.5" fill="#0969da" text-decoration="underline">support#118</text>
  <text x="492" y="128" font-size="12.5" fill="#1f2328">案件C・同型 → FW申請で解決</text>
  <text x="404" y="150" font-size="12.5" fill="#0969da" text-decoration="underline">support#94</text>
  <text x="480" y="150" font-size="12.5" fill="#1f2328">ルート広報漏れのケース(注意)</text>
  <text x="404" y="172" font-size="12.5" fill="#0969da" text-decoration="underline">Runbook: オンプレ疎通の切り分け</text>

  <!-- draft -->
  <rect x="44" y="224" width="672" height="130" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="248" font-size="12" fill="#57606a">回答ドラフト（編集可）</text>
  <text x="60" y="274" font-size="13" fill="#1f2328">開発環境の基盤VPCに当該宛先へのFirewall許可がないため、FW申請が必要です。</text>
  <text x="60" y="296" font-size="13" fill="#1f2328">申請フォームの「Firewallルール申請」からお願いします。</text>
  <text x="60" y="318" font-size="13" fill="#1f2328">参考: 過去の同型ケース（support#118）では申請から2営業日で反映されています。…</text>

  <!-- AI instruction -->
  <rect x="44" y="372" width="580" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="58" y="397" font-size="13" fill="#8c959f">AIに指示（例: #94のルート広報の観点も回答に含めて）</text>
  <rect x="636" y="372" width="80" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="676" y="397" font-size="13" fill="#1f2328" text-anchor="middle">再生成</text>

  <!-- footer buttons -->
  <line x1="44" y1="440" x2="716" y2="440" stroke="#d0d7de"/>
  <rect x="404" y="462" width="120" height="38" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="464" y="486" font-size="13" fill="#1f2328" text-anchor="middle">Issueを開く</text>
  <rect x="536" y="462" width="180" height="38" rx="6" fill="#0969da"/>
  <text x="626" y="486" font-size="13" fill="#ffffff" text-anchor="middle">この内容でIssueに回答</text>
  <text x="44" y="486" font-size="11.5" fill="#57606a">※この画面の内容は担当者のみ閲覧（AI分析は利用者に非公開）</text>
